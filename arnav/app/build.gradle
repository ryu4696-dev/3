plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.ryu.foldarnav'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.ryu.foldarnav'
        minSdk 31
        targetSdk 36
        versionCode 4
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'com.google.ar:core:1.56.0'
}
