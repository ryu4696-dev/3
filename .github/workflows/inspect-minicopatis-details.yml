name: Inspect MiniCoPaTis Source Details

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-minicopatis-details.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source
        run: |
          GOOD=7b554590b919359d104d3ab34b067fd52474a37c
          git show "$GOOD:.github/ledger-build-0930/part1.b64" > /tmp/p1
          git show "$GOOD:.github/ledger-build-0930/part4.b64" > /tmp/p4
          git show "$GOOD:.github/ledger-build-0930/part5.b64" > /tmp/p5
          git show "$GOOD:.github/ledger-build-0930/part2.b64" > /tmp/p2
          git show "$GOOD:.github/ledger-build-0930/part3.b64" > /tmp/p3
          cat /tmp/p1 /tmp/p4 /tmp/p5 /tmp/p2 /tmp/p3 > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.bz2
          tar -xjf /tmp/src.tar.bz2
      - name: Show relevant source
        run: |
          echo '===== CsvImporter 1-280 ====='
          sed -n '1,280p' ledgerapp/app/src/main/java/jp/co/ichika/salesledger/CsvImporter.kt
          echo '===== DataRepository 220-410 ====='
          sed -n '220,410p' ledgerapp/app/src/main/java/jp/co/ichika/salesledger/DataRepository.kt
          echo '===== MainActivity 230-430 ====='
          sed -n '230,430p' ledgerapp/app/src/main/java/jp/co/ichika/salesledger/MainActivity.kt
          echo '===== SalesTableView 1-360 ====='
          sed -n '1,360p' ledgerapp/app/src/main/java/jp/co/ichika/salesledger/SalesTableView.kt
          echo '===== Models 1-130 ====='
          sed -n '1,130p' ledgerapp/app/src/main/java/jp/co/ichika/salesledger/Models.kt
