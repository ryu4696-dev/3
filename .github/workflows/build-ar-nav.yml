name: Build Fold AR Nav APK

on:
  push:
    branches: [ "ar-nav-20260926" ]
    paths:
      - "arnav/**"
      - ".github/workflows/build-ar-nav.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: arnav
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoldARNav-debug
          path: arnav/app/build/outputs/apk/debug/app-debug.apk
