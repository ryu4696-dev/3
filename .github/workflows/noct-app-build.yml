name: Build Noct-Q Android APK

on:
  push:
    branches: [ noct-q-android ]
    paths:
      - '.github/workflows/noct-app-build.yml'
      - 'noct-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"

      - name: Checkout libQwenImage21
        run: |
          git clone https://github.com/scsonic/libQwenImage21.git upstream
          cd upstream
          git checkout f28617b6933593dfabdb8e273014f88d9108c0c2
          cd ..

      - name: Apply Noct-Q app
        run: |
          cp noct-app/MainActivity.java upstream/demo/src/main/java/com/scsonic/qwenimage21/demo/MainActivity.java
          cp noct-app/NoctOverlayDownloader.java upstream/demo/src/main/java/com/scsonic/qwenimage21/demo/NoctOverlayDownloader.java
          cp noct-app/activity_main.xml upstream/demo/src/main/res/layout/activity_main.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path("upstream/demo/src/main/AndroidManifest.xml")
          s=p.read_text().replace('android:label="Qwen-Image 2.1"', 'android:label="Noct-Q Anime"')
          p.write_text(s)
          p=Path("upstream/demo/build.gradle")
          s=p.read_text().replace("applicationId 'com.scsonic.qwenimage21.demo'", "applicationId 'com.noctq.anime'")
          s=s.replace("versionName '0.1'", "versionName '0.1-noct'")
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: upstream
        run: ./gradlew :demo:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          cp upstream/demo/build/outputs/apk/debug/demo-debug.apk Noct-Q-Anime-debug.apk
          sha256sum Noct-Q-Anime-debug.apk > Noct-Q-Anime-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Noct-Q-Anime-APK
          path: |
            Noct-Q-Anime-debug.apk
            Noct-Q-Anime-debug.apk.sha256
          retention-days: 30
