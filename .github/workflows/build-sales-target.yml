name: Build Sales Target APK

on:
  push:
    branches: [ "sales-target" ]
    paths-ignore:
      - ".github/salestarget/SalesTarget-v1.0.apk.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore project
        run: |
          mkdir -p /tmp/salestarget
          cat .github/salestarget/chunk00 .github/salestarget/chunk01 .github/salestarget/chunk02 .github/salestarget/chunk03 .github/salestarget/chunk04 | base64 -d > /tmp/salestarget.zip
          unzip -q /tmp/salestarget.zip -d /tmp/salestarget
      - name: Build release APK
        working-directory: /tmp/salestarget
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesTarget-v1.0
          path: /tmp/salestarget/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish APK for retrieval
        run: |
          base64 -w0 /tmp/salestarget/app/build/outputs/apk/release/app-release.apk > .github/salestarget/SalesTarget-v1.0.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/salestarget/SalesTarget-v1.0.apk.b64
          git commit -m "Publish SalesTarget v1.0 APK" || exit 0
          git push
